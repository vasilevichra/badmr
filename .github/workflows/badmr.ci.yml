name: badmr CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Расшифровать секретные seed-данные (specific.ts, 05-specific-*.sql)
      env:
        CI_SEED_KEY: ${{ secrets.CI_SEED_KEY }}
      run: |
        openssl enc -d -aes-256-cbc -pbkdf2 -in etc/ci-seed.enc -out /tmp/ci-seed.tar -pass env:CI_SEED_KEY
        tar -xf /tmp/ci-seed.tar -C .
    - run: npm test
