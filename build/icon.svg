    <path fill="url(#g2)" d="M262 76
      C 190 96 130 160 122 240
      C 116 310 170 370 240 372
      C 300 374 340 326 330 264
      C 318 190 300 110 262 76 Z"/>
    <path fill="url(#g3)" d="M372 130
      C 320 140 260 190 250 260
      C 242 320 282 372 344 374
      C 400 376 440 330 434 270
      C 428 210 404 160 372 130 Z"/>
  </g>

  <!-- бандаж пробковой основы -->
  <g transform="rotate(-12 355 404)">
    <rect x="280" y="372" width="150" height="64" rx="30" fill="url(#band)" stroke="#ffffff" stroke-width="12"/>
  </g>
</svg>
